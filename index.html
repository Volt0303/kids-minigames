<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Kids Mini Games</title>
    <style>
      /* Bundled font (SIL Open Font License, see fonts/OFL.txt). */
      @font-face {
        font-family: 'Zen Maru Gothic';
        src: url('./fonts/ZenMaruGothic-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Same light blue as COLORS.background (theme.ts), so there is nothing to flash past. */
        background: #dcf2ff;
      }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /*
       * Shown until the game has something to draw (first boot, and again whenever a screen
       * change needs to load its own pictures) — so the page is never just a plain colour.
       * Pure CSS: it is already spinning before any JavaScript has run.
       */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dcf2ff;
        z-index: 1;
        transition: opacity 0.2s ease-out;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading .spinner {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 12px solid #ffffff;
        border-top-color: #2b7de9;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading"><div class="spinner"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
