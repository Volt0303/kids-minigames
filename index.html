<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Kids Mini Games</title>
    <style>
      /* Bundled font (SIL Open Font License, see fonts/OFL.txt). */
      @font-face {
        font-family: 'Zen Maru Gothic';
        src: url('./fonts/ZenMaruGothic-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b3d6b;
      }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>

    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
